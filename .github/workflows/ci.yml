name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Node.js 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fetch pinned gorak compatibility fixtures
        run: npm run compatibility:fetch
      - name: Certify gorak release compatibility
        run: npm run test:compatibility
      - name: Run behavioural tests and build
        run: npm run verify
      - name: Desktop smoke test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

  package:
    name: Package and validate library
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package, check tag version, and validate extracted consumer
        run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: library-release
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: library-release
          path: release
      - name: Verify archive checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish validated GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS \
              --verify-tag --prerelease --title "gorak frame designer $GITHUB_REF_NAME" \
              --notes "Embeddable ES module library and type declarations for pinned host integration. Verify the archive with SHA256SUMS. No Electron runtime or npm registry publication."
          fi

  notify-ecosystem:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/notify-ecosystem.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      ECOSYSTEM_DISPATCH_TOKEN: ${{ secrets.ECOSYSTEM_DISPATCH_TOKEN }}
